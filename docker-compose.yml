services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: aimalya-app
    ports:
      - '3001:3000'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://aimalya:aimalya_dev_password@db:5432/aimalya?schema=public
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./package.json:/app/package.json
    command: sh -c "npx prisma generate --schema prisma/schema.prisma && npx prisma db push --schema prisma/schema.prisma --url \"$$DATABASE_URL\" && npm run start:dev"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aimalya-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: aimalya-db
    environment:
      POSTGRES_DB: aimalya
      POSTGRES_USER: aimalya
      POSTGRES_PASSWORD: aimalya_dev_password
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aimalya-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aimalya']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: # This is the "Safe Box" for your database

networks:
  aimalya-network:
    driver: bridge