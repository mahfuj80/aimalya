services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: aimalya-app
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://aimalya:aimalya_dev_password@db:5432/aimalya?schema=public
      REDIS_URL: redis://redis:6379
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./package.json:/app/package.json
      - /app/node_modules
    command: npm run start:dev
    depends_on:
      - db
      - redis
    networks:
      - aimalya-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: aimalya-db
    environment:
      POSTGRES_DB: aimalya
      POSTGRES_USER: aimalya
      POSTGRES_PASSWORD: aimalya_dev_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aimalya-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aimalya']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aimalya-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - aimalya-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  aimalya-network:
    driver: bridge
